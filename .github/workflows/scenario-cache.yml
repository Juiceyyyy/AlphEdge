name: Build scenario cache
on:
  schedule:
    - cron: '33 13,15 * * 1-5' # Two weekday chances after India market close; GitHub may delay schedules.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scenario-cache.yml'
      - 'jobs/build_scenarios.py'
      - 'jobs/build_benchmarks.py'
permissions:
  contents: write
concurrency:
  group: historical-scenario-cache
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore market-data downloads
        uses: actions/cache@v4
        with:
          path: cache/
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-
      - name: Build historical scenarios
        run: python -m jobs.build_scenarios
      - name: Cache Yahoo index price closes
        run: python -m jobs.build_benchmarks
      - name: Build annual and window cache
        run: python -m jobs.build_research_cache
      - name: Build daily target baskets
        run: python -m jobs.build_holdings
      - name: Advance forward snapshot only when required
        env:
          RESEARCH_SNAPSHOT_FILE: state/current_snapshot.json
        run: |
          python - <<'PYREFRESH'
          import json
          from pathlib import Path
          snapshot = json.loads(Path('state/current_snapshot.json').read_text())
          scenarios = json.loads(Path('state/scenarios.json').read_text())
          if snapshot.get('strategy_id') != scenarios.get('strategy_id') or snapshot['price_date'] < scenarios['data_through']:
              from jobs.refresh import refresh
              refresh()
          else:
              print(f"Forward snapshot already covers {snapshot['price_date']}")
          PYREFRESH
      - name: Verify one coherent publication date
        run: |
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          names = ('scenarios', 'benchmarks', 'research_cache', 'holdings_cache', 'current_snapshot')
          data = {name: json.loads((Path('state') / (name + '.json')).read_text()) for name in names}
          date = data['scenarios']['data_through']
          assert all(data[name]['data_through'] == date for name in ('benchmarks', 'research_cache'))
          assert data['holdings_cache']['price_date'] == date
          assert data['current_snapshot']['price_date'] == date
          assert data['current_snapshot']['forward'][-1]['date'] == date
          assert data['holdings_cache']['baskets']['1/1/10/5']['date'] == date
          assert len({data[name]['strategy_id'] for name in names}) == 1
          print(f'Validated synchronized research through {date}')
          PYVERIFY
      - name: Update static fallbacks
        run: |
          cp state/current_snapshot.json hosting/site/data/current_snapshot.json
          cp state/scenarios.json hosting/site/data/scenarios.json
          cp state/benchmarks.json hosting/site/data/benchmarks.json
          cp state/research_cache.json hosting/site/data/research_cache.json
          cp state/holdings_cache.json hosting/site/data/holdings_cache.json
      - name: Commit public scenarios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/benchmarks.json hosting/site/data/benchmarks.json state/current_snapshot.json state/scenarios.json state/research_cache.json state/holdings_cache.json hosting/site/data/current_snapshot.json hosting/site/data/scenarios.json hosting/site/data/research_cache.json hosting/site/data/holdings_cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh daily research cache"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main

name: Daily research refresh
on:
  schedule:
    - cron: '17 13 * * 1-5' # 18:47 IST on weekdays; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-refresh.yml'
permissions:
  contents: write
concurrency:
  group: daily-research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh public model snapshot
        env:
          RESEARCH_SNAPSHOT_FILE: state/current_snapshot.json
        run: python -m jobs.refresh
      - name: Update static fallback
        run: cp state/current_snapshot.json site/data/current_snapshot.json
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- state/current_snapshot.json site/data/current_snapshot.json && [ -z "$(git ls-files --others --exclude-standard -- state/current_snapshot.json)" ]; then
            echo "No new price date; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/current_snapshot.json site/data/current_snapshot.json
          git commit -m "Update research snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

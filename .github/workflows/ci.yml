name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q alpha_strategy dashboard broker jobs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dashboard/explorer.js
      - run: node --test worker/telegram.test.mjs
      - run: node tests/research_ui_smoke.cjs
      - run: python -m jobs.export_site
      - name: Verify exported dashboard assets
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('site/index.html').read_text()
          assert 'window.ALPHEDGE_STATIC=true' in page
          assert 'src="/app.js?v=9"' in page
          assert 'href="/styles.css?v=12"' in page
          assert '/explore/app.js' not in page
          for asset in ('app.js', 'styles.css'):
              assert (Path('site') / asset).is_file()
          PY

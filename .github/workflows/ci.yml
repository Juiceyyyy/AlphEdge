name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q alpha_strategy broker dashboard jobs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hosting/site/app.js
      - run: node --check hosting/telegram/worker.mjs
      - name: Verify required published assets and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('hosting/site')
          for name in ('index.html', 'app.js', 'styles.css', 'logo.svg', 'og-image.png'):
              assert (root / name).is_file(), name
          data = {name: json.loads((root / 'data' / (name + '.json')).read_text())
                  for name in ('current_snapshot', 'scenarios', 'benchmarks', 'research_cache', 'holdings_cache')}
          date = data['scenarios']['data_through']
          assert data['research_cache']['data_through'] == date
          assert data['benchmarks']['data_through'] == date
          assert data['holdings_cache']['price_date'] == date
          assert data['current_snapshot']['price_date'] == date
          assert data['current_snapshot']['forward'][-1]['date'] == date
          assert len({item['strategy_id'] for item in data.values()}) == 1
          assert json.loads(Path('vercel.json').read_text())['outputDirectory'] == str(root)
          PY

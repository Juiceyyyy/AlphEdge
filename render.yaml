# Apply this Blueprint only from your own new repository. No existing deployment is referenced.
databases:
  - name: alphedge-db
    plan: basic-256mb
    region: singapore
    ipAllowList: []
services:
  - type: web
    name: alphedge-web
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.app:api --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: alphedge-db
          property: connectionString
  - type: cron
    name: alphedge-refresh
    runtime: python
    plan: starter
    region: singapore
    schedule: "0 13 * * 1-5" # UTC, 18:30 IST on weekdays
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.refresh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: alphedge-db
          property: connectionString
